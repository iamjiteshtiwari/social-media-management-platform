name: Backend source checks

on:
  push:
    branches:
      - s4-backend-foundation
  pull_request:
    branches:
      - s4-backend-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse Apps Script JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/apps-script/*.gs; do
            echo "Checking $file"
            node --check < "$file"
          done
